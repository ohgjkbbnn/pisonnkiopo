name: iOS canary build

on:
  push:
    branches: [ios-beta]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-canary-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/gradle/libs.versions.toml') }}

      - name: Build unsigned IPA
        working-directory: ios/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Resona.app build/ipa/Payload/
          cd build/ipa && zip -qry ../Resona-canary.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Resona-ios-canary-${{ github.run_number }}
          path: ios/iosApp/build/Resona-canary.ipa
          retention-days: 30
