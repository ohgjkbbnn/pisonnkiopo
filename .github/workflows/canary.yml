name: Canary build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: canary-build
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Write local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cat > local.properties <<EOF
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          TELEGRAM_API_ID=$TELEGRAM_API_ID
          TELEGRAM_API_HASH=$TELEGRAM_API_HASH
          EOF

      - name: Set build metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build canary APKs
        run: ./gradlew assembleCanary --no-daemon --stacktrace -PappVersionCode=${{ steps.vars.outputs.version_code }}

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/canary/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove previous Canary Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view canary >/dev/null 2>&1; then
            gh release delete canary --yes --cleanup-tag
          elif gh api "repos/$GH_REPO/git/ref/tags/canary" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/canary"
          fi

      - name: Publish Canary Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary
          name: Canary build ${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            automated Android canary build from `${{ steps.vars.outputs.sha_short }}` on `main`.
          files: |
            app/build/outputs/apk/canary/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
