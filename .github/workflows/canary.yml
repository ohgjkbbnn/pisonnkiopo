
name: Canary build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: canary-build
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Write local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cat > local.properties <<EOF
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          TELEGRAM_API_ID=$TELEGRAM_API_ID
          TELEGRAM_API_HASH=$TELEGRAM_API_HASH
          EOF

      - name: Set build metadata
        id: vars
        env:
          CANARY_VERSION_CODE_BASE: 100000
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_code=$((CANARY_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric Android images
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build canary APKs
        run: ./gradlew assembleCanary --no-daemon -PappVersionCode=${{ steps.vars.outputs.version_code }}

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/canary/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/gradle/libs.versions.toml') }}

      - name: Build unsigned IPA
        working-directory: ios/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Resona.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../Resona-canary.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/iosApp/build/Resona-canary.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish combined Canary Release
    needs: [android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets/ios

      - name: Set build metadata
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Remove previous Canary Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete canary --yes --cleanup-tag || true

      - name: Publish combined Canary Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary
          name: Canary build ${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Automated Android and iOS canary build from `${{ steps.vars.outputs.sha_short }}` on `main`.

            Not for production use.
            Android: APK
            iOS: unsigned IPA; signing is required for installation on a physical iPhone.
          files: |
            release-assets/android/*.apk
            release-assets/ios/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

